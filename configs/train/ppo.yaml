# PPO training configuration

train:
  name: ppo
  
  # Training steps
  total_steps: 1000000
  
  # PPO hyperparameters
  learning_rate: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  
  # Mini-batch training
  n_epochs: 4
  batch_size: 64
  
  # Mixed precision
  use_amp: false
  
  # Curriculum learning
  curriculum_steps: 500000
